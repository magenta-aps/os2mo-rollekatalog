query GetTitles {
  classes(filter: {facet: {user_keys:"engagement_job_function"}}) {
    objects {
      current {
        name
        uuid
      }
    }
  }
}


query GetFunctions {
  classes(filter: {facet: {user_keys:"association_type"}}) {
    objects {
      current {
        name
        uuid
      }
    }
  }
}


query GetPerson(
  $employee_uuid: UUID!
  $root_uuids: [UUID!]!
  $itsystem_user_keys: [String!]!
  $employee_email_user_key: String!
  $mit_id_user_key: String!
  $now: DateTime!
) {
  employees(
    filter: { uuids: [$employee_uuid], from_date: $now, to_date: null }
  ) {
    objects {
      current {
        uuid
        user_key
        nickname
        name
        email: addresses(
          filter: {
            address_type: {user_keys: [$employee_email_user_key]}
            from_date: null
            to_date: null
          }
        ) {
          uuid
          value
          validity {
            from
            to
          }
          ituser(filter: {from_date: $now, to_date: null}) {
            uuid
          }
        }
        mitid: addresses(
          filter: {
            address_type: {user_keys: [$mit_id_user_key]}
            from_date: $now
            to_date: null
          }
        ) {
          value
          ituser(filter: {from_date: $now, to_date: null}) {
            uuid
          }
        }
        associations(
          filter: { it_association: false, from_date: $now, to_date: null }
        ) {
          uuid
          association_type {
            uuid
          }
          org_unit(
            filter: {
              ancestor: { uuids: $root_uuids }
              from_date: $now
              to_date: null
            }
          ) {
            uuid
            org_unit_level {
              uuid
            }
            ancestors {
              uuid
              org_unit_level {
                uuid
              }
            }
            validity {
              from
              to
            }
          }
          validity {
            from
            to
          }
        }
        itusers(
          filter: {
            itsystem: { user_keys: $itsystem_user_keys }
            from_date: $now
            to_date: null
          }
        ) {
          uuid
          user_key
          external_id
          itsystem {
            user_key
          }
          validity {
            from
            to
          }
          addresses(
            filter: {
              address_type: {user_keys: [$employee_email_user_key]}
              from_date: null
              to_date: null
            }
          ) {
            uuid
            value
            validity {
              from
              to
            }
          }
          engagements(filter: { from_date: $now, to_date: null }) {
            validities {
              uuid
              validity {
                from
                to
              }
              org_unit(
                filter: {
                  ancestor: { uuids: $root_uuids }
                  from_date: $now
                  to_date: null
                }
              ) {
                uuid
                org_unit_level {
                  uuid
                }
                ancestors {
                  uuid
                  org_unit_level {
                    uuid
                  }
                }
                validity {
                  from
                  to
                }
              }
              job_function {
                name
                uuid
              }
            }
          }
        }
      }
    }
  }
}


query GetUuidsForItUser($uuid: UUID!) {
  itusers(filter: {uuids: [$uuid]}) {
    objects {
      validities(start: null, end: null) {
        person {
          uuid
          engagements {
            org_unit_uuid
          }
        }
      }
    }
  }
}


