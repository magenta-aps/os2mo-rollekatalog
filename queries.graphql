query GetOrgUnit(
  $uuid: UUID!
  $root_uuids: [UUID!]!
  $itsystem_user_keys: [String!]!
  $now: DateTime!
) {
  org_units(
    filter: {
      uuids: [$uuid]
      ancestor: { uuids: $root_uuids }
      from_date: $now
      to_date: null
    }
  ) {
    objects {
      current {
        uuid
        name
        parent {
          uuid
        }
        org_unit_level {
          uuid
        }
        ancestors {
          uuid
          org_unit_level {
            uuid
          }
        }
        managers(filter: {from_date: $now, to_date: null}){
          person(filter: {from_date: $now, to_date: null}){
            uuid
            itusers(filter: { itsystem: { user_keys: $itsystem_user_keys }, from_date: $now, to_date: null}) {
              uuid
              user_key
              external_id
              itsystem {
                user_key
              }
              validity {
                from
                to
              }
              engagements(filter: { org_unit: {uuids: [$uuid]}, from_date: $now, to_date: null }) {
                current {
                  org_unit(
                    filter: {
                      from_date: $now
                      to_date: null
                    }
                  ) {
                      uuid
                  }
                }
              }
            }
          }
        }
        kles(filter: {from_date: $now, to_date: null}){
          kle_number {
            user_key
          }
          kle_aspects {
            scope
          }
        }
      }
    }
  }
}


query GetOrgUnitUuidForKle($uuid: UUID!) {
  kles(filter: {uuids: [$uuid], from_date: null, to_date: null}) {
    objects {
      validities {
        org_unit_uuid
      }
    }
  }
}


query GetOrgUnitUuidForManager($uuid: UUID!) {
  managers(filter: {uuids: [$uuid], from_date: null, to_date: null}) {
    objects {
      validities {
        org_unit_uuid
      }
    }
  }
}


